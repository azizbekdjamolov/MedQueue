services:
  - type: web
    name: medqueue-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: AI_MODEL
        value: openrouter/free
      - key: TELEGRAM_WEBAPP_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: MEDQUEUE_TICK_MS
        value: "30000"

  - type: static
    name: medqueue-frontend
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_BASE_URL
        sync: false

